name: isyeri_takip
description: İşyeri personel giriş-çıkış takip (çevrimdışı, NFC)
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.0
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  crypto: ^3.0.0
  intl: ^0.20.3
  nfc_manager: ^4.4.0
  nfc_manager_android: ^1.0.0 # nfc_manager 4.x ile uyumlu alt paket  
  wakelock_plus: ^1.2.8
  audioplayers: ^6.1.0
  pdf: ^3.11.1
  printing: ^5.13.3
  excel: ^4.0.6
  share_plus: ^10.0.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/sounds/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
